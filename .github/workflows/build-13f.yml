name: 13F 분기 배치

# ⚠ 크론에 제출일을 박지 않는다. 13F 는 "분기 마감 후 45일" 이고
#    그날이 주말·공휴일이면 밀린다. 2027 년만 봐도 2/16 · 5/17 · 8/16 · 11/15 다.
#    그래서 2·5·8·11 월에 주 1 회 돌리고, 스크립트가 이미 받은 분기면 몇 초로 끝낸다.
on:
  schedule:
    - cron: '0 9 * * 1'        # 매주 월요일 09:00 UTC (KST 18:00)
  workflow_dispatch:            # 손으로도 돌릴 수 있다
    inputs:
      force:
        description: '이미 받은 분기라도 다시 받는다'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: f13
  cancel-in-progress: false     # ⚠ 중간에 끊으면 이어받기 상태가 어긋난다

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # 72 펀드 × 2 분기 × 1.2 초 ≈ 30 분. 넉넉히 둔다

    steps:
      - name: 실행 월 확인
        id: gate
        run: |
          M=$(date -u +%m)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "손으로 돌린 실행이라 월 제한을 건너뛴다."
            echo "go=yes" >> $GITHUB_OUTPUT
          elif [ "$M" = "02" ] || [ "$M" = "05" ] || [ "$M" = "08" ] || [ "$M" = "11" ]; then
            echo "$M 월 — 13F 제출 월이다."
            echo "go=yes" >> $GITHUB_OUTPUT
          else
            echo "$M 월 — 제출 월이 아니다. 끝낸다."
            echo "go=no" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: '3.12'
          cache: pip

      - name: 라이브러리
        if: steps.gate.outputs.go == 'yes'
        run: pip install edgartools google-cloud-firestore

      # ⚠ 이어받기 상태를 캐시로 남긴다. 없으면 매주 72 곳을 다시 받는다.
      - name: 상태 캐시 복원
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: out
          key: f13-out-${{ github.run_id }}
          restore-keys: f13-out-

      - name: 13F 수집
        if: steps.gate.outputs.go == 'yes'
        run: python build_13f.py ${{ inputs.force && '--force' || '' }}

      - name: Firestore 업로드
        if: steps.gate.outputs.go == 'yes'
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: python upload_13f.py

      - name: 상태 캐시 저장
        if: steps.gate.outputs.go == 'yes' && always()
        uses: actions/cache/save@v4
        with:
          path: out
          key: f13-out-${{ github.run_id }}

      - name: 결과 보관
        if: steps.gate.outputs.go == 'yes' && always()
        uses: actions/upload-artifact@v4
        with:
          name: f13-${{ github.run_id }}
          path: out/*.json
          retention-days: 14
